# Generated by scripts/render_marketing_sync_workflow.py. Edit sync_upstream.py.
name: Sync Marketing Skills upstream

on:
  schedule:
    - cron: '17 7 * * 1'
      timezone: Europe/Dublin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketing-skills-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Elevation-Business-OS/marketingskills' && github.ref == 'refs/heads/codex/automation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify, sync and record upstream revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          """GitHub-hosted fork maintenance. Only repository APIs; never run upstream code."""
          import base64
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          FORK = "Elevation-Business-OS/marketingskills"
          UPSTREAM = "coreyhaines31/marketingskills"
          CONTROL = "codex/automation"
          
          
          def api(path, method="GET", payload=None):
              request = Request(
                  "https://api.github.com/" + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2026-03-10"})
              try:
                  with urlopen(request, timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except HTTPError as error:
                  # Report status and endpoint, never tokens or arbitrary response bodies.
                  raise RuntimeError(f"GitHub {method} {path} returned HTTP {error.code}") from None
          
          
          def sync(call=api, pause=time.sleep):
              if os.environ.get("GITHUB_REPOSITORY") != FORK or os.environ.get("GITHUB_REF") != "refs/heads/" + CONTROL:
                  raise RuntimeError("Unexpected repository or workflow branch; no changes made.")
              metadata = call(f"repos/{FORK}")
              if metadata.get("parent", {}).get("full_name") != UPSTREAM or metadata.get("default_branch") != CONTROL:
                  raise RuntimeError("Unexpected fork parent or scheduler branch; no changes made.")
              initial = call(f"repos/{FORK}/commits/main")["sha"]
              for attempt in range(3):
                  upstream = call(f"repos/{UPSTREAM}/commits/main")["sha"]
                  before = call(f"repos/{FORK}/commits/main")["sha"]
                  comparison = call(f"repos/{UPSTREAM}/compare/{upstream}...{before}")
                  if comparison["ahead_by"] or comparison["status"] not in ("identical", "behind"):
                      raise RuntimeError("Fork main has independent history. Refusing to merge or overwrite it.")
                  # Run even when already current to exercise actual write authorization.
                  call(f"repos/{FORK}/merge-upstream", "POST", {"branch": "main"})
                  after = call(f"repos/{FORK}/commits/main")["sha"]
                  latest = call(f"repos/{UPSTREAM}/commits/main")["sha"]
                  if after == latest:
                      return {"status": "current", "checked_at": datetime.now(timezone.utc).isoformat(),
                              "fork": FORK, "upstream": UPSTREAM, "branch": "main",
                              "previous_revision": initial, "revision": after,
                              "upstream_revision": latest, "changed": after != initial,
                              "run_url": f"https://github.com/{FORK}/actions/runs/" + os.environ["GITHUB_RUN_ID"]}
                  if attempt < 2:
                      pause(2)
              raise RuntimeError("Upstream and fork differ after three attempts; inspect concurrent changes.")
          
          
          def record_success(result, call=api):
              # A small audit commit on the control branch also supplies repository activity
              # when upstream is quiet; main remains an exact upstream reference.
              path = ".sync/last-success.json"
              current = call(f"repos/{FORK}/contents/{path}?ref={CONTROL}")
              encoded = base64.b64encode((json.dumps(result, indent=2) + "\n").encode()).decode()
              call(f"repos/{FORK}/contents/{path}", "PUT",
                   {"branch": CONTROL, "sha": current["sha"], "content": encoded,
                    "message": "Record successful weekly upstream check"})
          
          
          if __name__ == "__main__":
              result = sync()
              record_success(result)
              summary = ("## Marketing Skills sync\n\n"
                         f"Status: **{result['status']}**\n\n"
                         f"Source branch: `{FORK}:main`\n\n"
                         f"Verified upstream revision: `{result['revision']}`\n\n"
                         f"Source changed: `{result['changed']}`\n\n"
                         "No upstream code executed. No private brain files accessed.\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary)
              print(json.dumps(result, indent=2))
